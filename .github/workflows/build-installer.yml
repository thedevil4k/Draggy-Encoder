name: Build Windows Installer

# Compila el instalador de Windows cuando toca código relevante o se
# publica una release. El EXE es autocontenido (sin torch/onnxruntime);
# junto a él se coloca un Python embebido con pip bootstrapado para que la
# app instale los runtimes de IA a demanda.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Todos los workflows de empaquetado comparten la cuota de artifacts. El
# mismo grupo serializa la limpieza y la subida entre Linux y Windows.
concurrency:
  group: draggy-packaging-${{ github.repository }}
  cancel-in-progress: false

env:
  PY_VERSION: "3.13.3"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # La cuota es compartida por Linux, Windows y Pages. Eliminamos todos
      # los artifacts temporales conocidos de ejecuciones terminadas antes de
      # compilar; los assets de Releases no se tocan.
      #
      # Cada workflow de empaquetado limpia TODO lo que conozca (Installer,
      # paquetes Linux y repo Flatpak de Pages), no solo sus propios
      # artefactos: una sola ejecución deja la cuota al mínimo y evita que se
      # acumulen artefactos huérfanos de la otra plataforma. Los assets de
      # Releases y el github-pages de la ejecución actual nunca se tocan.
      - name: Prune stale packaging artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const names = new Set([
              'DraggyEncoder-Installer',
              'DraggyEncoder-Linux-packages',
              'github-pages',
            ]);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            for (const artifact of artifacts) {
              if (!names.has(artifact.name)) continue;
              const runId = artifact.workflow_run && artifact.workflow_run.id;
              if (runId && Number(runId) === Number(context.runId)) continue;
              if (runId) {
                try {
                  const run = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: runId,
                  });
                  if (run.data.status !== 'completed') {
                    core.info(`Keeping artifact from active run ${artifact.name} (${artifact.id})`);
                    continue;
                  }
                } catch (error) {
                  core.warning(`Could not inspect run ${runId}; keeping artifact ${artifact.id}: ${error.message}`);
                  continue;
                }
              }
              core.info(`Deleting previous packaging artifact ${artifact.name} (${artifact.id})`);
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              } catch (error) {
                // Another packaging workflow may have removed it first.
                if (error.status === 404) {
                  core.info(`Artifact ${artifact.id} was already deleted`);
                } else {
                  throw error;
                }
              }
            }

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      # Regenera assets/app.ico (multi-resolución) desde assets/Import.png.
      # Se versiona también, pero regenerarlo aquí garantiza que el EXE y el
      # instalador usen SIEMPRE el logo actual aunque alguien cambie el PNG.
      - name: Generate multi-resolution app icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/windows/make_icon.py

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller draggy_encoder.spec --noconfirm --clean

      - name: Add embeddable Python (for on-demand AI runtime installs)
        run: |
          $zip = "python-$env:PY_VERSION-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VERSION/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "dist\DraggyEncoder\embed-python"
          Remove-Item $zip

      - name: Bootstrap pip in embedded Python
        run: |
          # CRÍTICO: el python embebido trae python313._pth con `#import site`
          # comentado. get-pip >= 26 instala pip en Scripts/ (solo wrappers),
          # NO en Lib/site-packages, a menos que site.py se ejecute DURANTE el
          # install. Habilitar `import site` ANTES del get-pip garantiza que
          # los wheels de pip caigan en site-packages y que tanto
          # `import pip` como `python.exe -m pip` funcionen en la app real.
          $pth = Get-ChildItem "dist\DraggyEncoder\embed-python\python*._pth" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $pth) {
            Write-Host "WARNING: no python*._pth found; pip bootstrap will likely fail"
          } else {
            Write-Host "patching $pth with import site"
            ($Lines = Get-Content $pth) | Out-Null
            $Lines = $Lines -replace '#\s*import site', 'import site'
            # Preserva CRLF correcto (Set-Content -NoNewline deja import site
            # sin newline final y en algunos builds el loader lo ignora).
            [IO.File]::WriteAllLines($pth, $Lines)
          }
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\dist\DraggyEncoder\embed-python\python.exe get-pip.py
          Remove-Item "get-pip.py"
          # Verifica con `-m pip` (modo de invocación REAL desde
          # src/runtimes/manager.py:_run_pip).
          .\dist\DraggyEncoder\embed-python\python.exe -m pip --version

      - name: Bundle VC++ runtime for torch (fix DLL load on clean Windows)
        shell: pwsh
        run: |
          # PyTorch on Windows needs vcruntime/msvcp (VC++ Redistributable).
          # Clean Windows 10/11 images in the wild miss it; the app would then
          # fail with "DLL load failed" after a successful pip install.
          # Copy the DLLs next to the embed-python and next to the EXE so both
          # the pip interpreter and the frozen app find them via
          # os.add_dll_directory / PATH. No admin install needed.
          $src = "C:\Windows\System32"
          $dsts = @("dist\DraggyEncoder\embed-python", "dist\DraggyEncoder")
          foreach ($dll in @("vcruntime140.dll","vcruntime140_1.dll","msvcp140.dll","msvcp140_1.dll","concrt140.dll")) {
            $p = Join-Path $src $dll
            if (Test-Path $p) {
              foreach ($dst in $dsts) {
                Copy-Item $p -Destination $dst -Force -ErrorAction SilentlyContinue
                Write-Host "bundled $dll -> $dst"
              }
            } else {
              Write-Host "NOTE: $dll not found at $p (skipping)"
            }
          }
          # Verify that at least the two critical DLLs are now present.
          foreach ($dll in @("vcruntime140.dll","msvcp140.dll")) {
            if (-not (Test-Path (Join-Path "dist\DraggyEncoder\embed-python" $dll))) {
              Write-Host "WARNING: $dll still not bundled"
            }
          }

      - name: Verify embedded Python isolation
        run: |
          # Guard against a future workflow change re-enabling imports from
          # the runner/user Python. The application must install AI wheels
          # with this interpreter and only into its own runtime store.
          $probe = @'
          import os, sys
          root = os.path.abspath(os.path.dirname(sys.executable))
          external = [
              os.path.abspath(p) for p in sys.path if p and
              "site-packages" in p.lower() and
              not os.path.abspath(p).lower().startswith(root.lower())
          ]
          if external:
              raise SystemExit("external site-packages in embedded Python: " + repr(external))
          print("embedded Python isolated:", sys.executable)
          print("sys.path:", sys.path)
          '@
          $probe | .\dist\DraggyEncoder\embed-python\python.exe -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Selftest the built EXE
        run: |
          .\dist\DraggyEncoder\DraggyEncoder.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $log = ".\dist\DraggyEncoder\bin\logs\selftest.log"
          if (-not (Test-Path $log)) { Write-Error "selftest.log no se generó"; exit 1 }
          Get-Content $log
          # Las tres pantallas principales deben construirse en offscreen:
          # QApplication, MainWindow y DependenciesDialog. Si falta alguna,
          # el bundle está roto aunque el import de módulos haya pasado.
          #
          # Las dos líneas del guard de runtimes pesados son la red que atrapa
          # la regresión del "instalado no arranca": validar torch/onnxruntime
          # importándolos dentro de la GUI (0xc0000005 en python313.dll). El
          # store de prueba del guard hace que se compruebe aunque el runner
          # no tenga torch instalado.
          foreach ($line in @(
            "OK   QApplication offscreen",
            "OK   MainWindow offscreen",
            "OK   DependenciesDialog offscreen",
            "OK   guard torch (store de prueba): sin import in-process",
            "OK   guard onnxruntime (store de prueba): sin import in-process",
            # El host de IA (proceso aparte con el Python privado) debe arrancar
            # en el bundle y mover frames: es quien carga torch sin meterlo en
            # la GUI. Sin esto, el instalador no puede hacer IA.
            "OK   host de IA arranca",
            "OK   host de IA: frames ida y vuelta"
          )) {
            if (-not (Select-String -Path $log -SimpleMatch -Quiet $line)) {
              Write-Error "Falta en selftest.log: $line"; exit 1
            }
          }

      # La suite de tests (1000+) sólo se ejecutaba a mano: el CI validaba
      # imports, el selftest del EXE y el empaquetado, pero ningún test. Así
      # vivió escondido un fallo real: dos tests que fallaban y, además, un
      # segfault de CPython al imprimir su traceback, que ocultaba el fallo
      # detrás del crash (``pytest tests/`` nunca llegaba al final).
      #
      # Va DESPUÉS del build del EXE para que la instalación de pytest no
      # pueda influir en el análisis de PyInstaller, y NO bloquea el
      # empaquetado todavía (`continue-on-error`): el runner limpio no tiene
      # ffmpeg ni torch, así que hay que ver un run verde aquí antes de
      # convertirlo en un gate. Los tests que necesitan esos runtimes se
      # saltan solos (``pytest.importorskip``).
      - name: Run test suite (observation mode)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install pytest
          python -m pytest tests/ -q

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: |
          $v = "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1' }}"
          if ($v -like "v*") { $v = $v.Substring(1) }
          iscc "/DDRAGGY_VERSION=$v" draggy_encoder.iss

      - name: Verify exactly one Windows installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path installer -Filter *.exe -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $installers | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }

      # ÚNICO paquete de Windows: el instalador x64. No se sube además un
      # artifact de Actions (era una segunda copia del mismo EXE y gastaba
      # cuota); la descarga vive solo en la Release.
      #
      # En pushes/manuales la descarga estable va a la release rodante
      # "latest": los assets de Releases NO cuentan contra la cuota de
      # artifacts de GitHub Actions, así que el instalador siempre queda
      # descargable. En tags se adjunta a la Release versionada de abajo.
      - name: Attach installer to rolling latest release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: installer/DraggyEncoder-Setup-*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/DraggyEncoder-Setup-*.exe
