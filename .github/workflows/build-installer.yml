name: Build Windows Installer

# Compila el instalador de Windows cuando toca código relevante o se
# publica una release. El EXE es autocontenido (sin torch/onnxruntime);
# junto a él se coloca un Python embebido con pip bootstrapado para que la
# app instale los runtimes de IA a demanda.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  PY_VERSION: "3.13.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller draggy_encoder.spec --noconfirm --clean

      - name: Add embeddable Python (for on-demand AI runtime installs)
        run: |
          $zip = "python-$env:PY_VERSION-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VERSION/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "dist\DraggyEncoder\embed-python"
          Remove-Item $zip

      - name: Bootstrap pip in embedded Python
        run: |
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\dist\DraggyEncoder\embed-python\python.exe get-pip.py
          Remove-Item "get-pip.py"
          # IMPORTANTE: enable import site en el ._pth del python embebido
          # (viene comentado por defecto); sin esto `pip --version` no
          # encuentra `Lib\site-packages` y todo lo que luego instale
          # huggingface_hub a demanda se rompe con "pip no se encuentra
          # disponible".
          $pth = Get-ChildItem "dist\DraggyEncoder\embed-python\python*._pth" | Select-Object -First 1 -ExpandProperty FullName
          if ($pth) {
            (Get-Content $pth) -replace '#\s*import site', 'import site' | Set-Content -NoNewline $pth
            Write-Host "patched $pth with import site"
          } else {
            Write-Host "WARNING: no python*._pth found; import pip may fail for embeddable python"
          }
          .\dist\DraggyEncoder\embed-python\python.exe -c "import pip; print('pip', pip.__version__)"

      - name: Selftest the built EXE
        run: |
          .\dist\DraggyEncoder\DraggyEncoder.exe --selftest
          if ($LASTEXITCODE -ne 0) { Get-Content .\dist\DraggyEncoder\bin\logs\selftest.log; exit $LASTEXITCODE }
          Get-Content .\dist\DraggyEncoder\bin\logs\selftest.log

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        run: |
          $v = "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}"
          if ($v -like "v*") { $v = $v.Substring(1) }
          iscc "/DDRAGGY_VERSION=$v" draggy_encoder.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraggyEncoder-Installer
          path: installer/*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
