# ============================================================
# BEBIDAS
# ============================================================

items:

  # ----------------------------------------------------------
  # Cerveza de Magma
  # ----------------------------------------------------------
  # ID interno del objeto.
  # Este es el nombre que usarás, por ejemplo:
  # /ce item get servidor:magma_beer
  #
  # "servidor" = namespace de TODO nuestro contenido custom.
  # "magma_beer" = identificador único de esta bebida.
  servidor:magma_beer:

    # --------------------------------------------------------
    # ITEM VANILLA BASE
    # --------------------------------------------------------
    # El objeto vanilla que usamos como base.
    #
    # Aquí usamos una botella de cristal porque queremos
    # que nuestro objeto se comporte inicialmente como ella.
    #
    # Puedes cambiarlo por otros materiales vanilla, por ejemplo:
    #   honey_bottle
    #   potion
    #   apple
    #   bread
    # etc.
    material: honey_bottle


    # --------------------------------------------------------
    # TEXTURA PERSONALIZADA
    # --------------------------------------------------------
    # Ruta de la textura dentro de nuestro resource pack.
    #
    # "servidor:item/magma_beer" significa que CraftEngine
    # buscará:
    #
    # resourcepack/assets/servidor/textures/item/magma_beer.png
    #
    # NO escribas ".png" aquí.
    texture: servidor:item/magma_beer


    # --------------------------------------------------------
    # DATOS DEL OBJETO
    # --------------------------------------------------------
    data:

      # ------------------------------------------------------
      # NOMBRE QUE VE EL JUGADOR
      # ------------------------------------------------------
      # "<!i>" evita que se aplique cursiva al nombre.
      #
      # <gold> = color dorado.
      #
      # Ejemplo:
      #   <red>Texto rojo
      #   <green>Texto verde
      #   <blue>Texto azul
      #   <yellow>Texto amarillo
      #
      # El nombre que aparecerá será:
      # "Cerveza de Magma"
      item_name: "<!i><gold>Cerveza de Magma"


      # ------------------------------------------------------
      # DESCRIPCIÓN DEL OBJETO
      # ------------------------------------------------------
      # Cada "-" crea una línea de lore.
      #
      # Puedes añadir tantas líneas como quieras.
      #
      # Ejemplo:
      #
      # lore:
      #   - "<gray>Primera línea"
      #   - "<gray>Segunda línea"
      #   - "<yellow>Precio: 3$"
      #
      lore:
        - "<!i><gray>Una cerveza del mismísimo Nether."
        
      remove_components:
        - minecraft:use_remainder

      # ------------------------------------------------------
      # COMPONENTES VANILLA DE MINECRAFT
      # ------------------------------------------------------
      # Aquí podemos utilizar los componentes modernos de
      # Minecraft 1.21.x directamente.
      #
      components:

        # ----------------------------------------------------
        # CONSUMIBLE
        # ----------------------------------------------------
        # Este componente hace que el objeto PUEDA CONSUMIRSE.
        #
        # Sin "consumable", nuestra botella personalizada
        # simplemente sería un objeto normal.
        minecraft:consumable:

          # --------------------------------------------------
          # TIEMPO NECESARIO PARA BEBER
          # --------------------------------------------------
          # Tiempo en segundos.
          #
          # 1.6 = tarda 1,6 segundos en beberse.
          #
          # Ejemplos:
          #   0.5 = muy rápido
          #   1.6 = parecido a una bebida normal
          #   3.0 = bebida lenta
          consume_seconds: 1.6


          # --------------------------------------------------
          # ANIMACIÓN
          # --------------------------------------------------
          # "drink" hace que Minecraft utilice la animación
          # de beber.
          #
          # No cambiar a "eat" si quieres que parezca bebida.
          animation: drink


          # --------------------------------------------------
          # SONIDO
          # --------------------------------------------------
          # Sonido que se reproduce mientras se consume.
          #
          # Este es el sonido vanilla de beber.
          #
          # Otros sonidos posibles:
          #
          # minecraft:entity.player.burp
          # minecraft:entity.generic.eat
          # etc.
          sound: minecraft:entity.generic.drink


          # --------------------------------------------------
          # PARTÍCULAS AL CONSUMIR
          # --------------------------------------------------
          # true  = muestra las partículas normales de consumo.
          # false = no muestra partículas.
          has_consume_particles: true


          # --------------------------------------------------
          # EFECTOS AL TERMINAR DE BEBER
          # --------------------------------------------------
          # Estos efectos NO se aplican al empezar a beber.
          # Se ejecutan cuando el jugador termina la bebida.
          on_consume_effects:

            # Tipo de efecto que vamos a aplicar.
            - type: minecraft:apply_effects

              # ------------------------------------------------
              # LISTA DE EFECTOS
              # ------------------------------------------------
              # Puedes poner varios efectos dentro de esta lista.
              effects:

                # ==============================================
                # NÁUSEA
                # ==============================================
                - id: minecraft:nausea

                  # --------------------------------------------
                  # NIVEL DEL EFECTO
                  # --------------------------------------------
                  # 0 = Nivel I
                  # 1 = Nivel II
                  # 2 = Nivel III
                  #
                  # OJO: Minecraft empieza a contar desde 0.
                  amplifier: 0

                  # --------------------------------------------
                  # DURACIÓN
                  # --------------------------------------------
                  # Se expresa en TICKS.
                  #
                  # 20 ticks = 1 segundo.
                  #
                  # 200 ticks = 10 segundos.
                  duration: 200


              # ------------------------------------------------
              # PROBABILIDAD
              # ------------------------------------------------
              # 1.0 = 100%
              # 0.5 = 50%
              # 0.1 = 10%
              probability: 0.25
         
        